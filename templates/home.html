{% extends "base.html" %}

{% block title %}Olive WPT Output Review{% endblock %}
{% block body_class %}wpt-index{% endblock %}

{% block content %}
<h1>Olive WPT Tests</h1>
<ul class="wpt-test-list">
  {% for item in tests %}
  <li class="wpt-test-entry">
    <span class="wpt-status wpt-status-{{ item.status|lower }}">{{ item.status }}</span>
    <a href="{{ item.test.review_url }}">{{ item.test.path }}</a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
